<!-- ---------- 1. CÀI ĐẶT CHUNG ----------
     Mỗi dòng có dạng   tên: giá trị   (không cần dấu nháy).
     Muốn xuống dòng trong một giá trị thì gõ dấu |
     Dòng bắt đầu bằng // là ghi chú, trang sẽ bỏ qua. Xóa một dòng thì trang dùng giá trị mặc định. -->
<script type="text/plain" id="cauhinh">
// ----- Bưu thiếp bìa -----
// Dòng chữ KÝ chạy từ trái qua phải trên bưu thiếp bìa (viết tay, tự ký lại sau mỗi vài giây)
bia_ky: Đến Từ Ban Truyền Thông
// Phần chữ trong dòng ký trên được tô NHIỀU MÀU (mỗi chữ cái một màu). Gõ lại đúng phần chữ muốn tô màu.
// Để trống = không tô nhiều màu, cả dòng một màu xanh.
bia_ky_noibat: Truyền Thông
bia_tieude:
// Hoa nở quanh bưu thiếp bìa khi bấm vào. Để trống = bộ mặc định (hoa hồng, tulip, hoa sứ).
// Gõ  khong  để tắt hoa. Hoặc chọn loại, ví dụ:  hoa_bia: tulip   hoặc   hoa_bia: hong su
// (loại hoa: hong = hoa hồng, tulip = hoa tulip, su = hoa sứ)
hoa_bia:
// Để TRỐNG (không gõ gì sau dấu :) là ẩn dòng đó đi cho ảnh bìa thoáng
bia_phu:
bia_tem:
bia_dau:
bia_h1: Những điều tôi đã viết
bia_nut: Chạm vào bưu thiếp để mở thư
// Hashtag cách nhau bằng dấu cách. Trên ảnh hiện tối đa 5 cái, lơ lửng quanh bưu thiếp tối đa 6 cái
hashtag:
hashtag_troi: #gửiđếnbạn #thưtay #mãiyêu #YouthBond #kynangthanhcong

// ----- Banner chọn chủ đề -----
banner_tde: Gửi đến bạn
banner_phu: Chọn một chủ đề để mở những bức thư
banner_ve: ← Về bìa
loai_dem: {n} bức thư
thap_tde: Chọn một bức thư
thap_dem: {n} bức thư
thap_ve: ← Chọn chủ đề khác

// ----- Chữ ký cuối mỗi thư -----
// kiểu chữ chọn một trong năm: Playwrite VN | Dancing Script | Pacifico | Great Vibes | Allura   (cỡ chữ: 1.45 là vừa, 2 là to)
chuky_macdinh: Hẹn thư sau ♥
chuky_kieuchu: Playwrite VN
chuky_cochu: 1.45

// ----- Thư không có ảnh -----
// bat = hiện khối trang trí theo chủ đề thay cho ảnh   tat = không hiện gì (thư chỉ có chữ)
trangtri_khong_anh: bat

// ----- Hiệu ứng bất ngờ khi mở thư -----
// tile: 0 là không bao giờ, 0.7 là khoảng 7 trên 10 lần mở, 1 là lần nào cũng có
hieuung_tile: 0.7
// bớt tên nào thì hiệu ứng đó không xuất hiện: phao-hoa lap-lanh bong-bay tim-hong phao-hoa-dem
hieuung_loai: phao-hoa lap-lanh bong-bay tim-hong phao-hoa-dem
</script>

<script type="text/plain" class="la-thu">
loai: cam-on
tieude: Gửi cả nhà
ngay: 11/11/2026
ky: Một Người Trong Youth Bond
---
Em muốn gửi lời cảm ơn đến cả nhà mình vì đã cùng nhau đồng hành, cùng nhau trải qua hành trình của cả 3 đợt vừa qua. ❤️

Thật ra, ở đợt đầu tiên, em vẫn còn khá thờ ơ, trầm tính và chưa thật sự cởi mở với mọi người. Nhưng càng có cơ hội trò chuyện, vui chơi và tham gia các hoạt động cùng cả nhà, em càng cảm thấy vui và trân trọng những khoảnh khắc ấy. Đối với em, đôi khi niềm vui chẳng cần phải đến từ điều gì quá lớn lao, chỉ cần được ở cạnh mọi người, cùng cười nói, cùng chia sẻ những câu chuyện nhỏ nhặt thôi cũng đủ khiến em cảm thấy hạnh phúc rồi.

Đặc biệt, có một điều rất nhỏ nhưng lại khiến em xúc động vô cùng, đó là lần đầu tiên em được ngồi ăn chung một mâm với đông đủ mọi người như vậy. Bình thường, em vẫn hay lủi thủi ăn một mình, cứ nghĩ ăn uống đơn giản chỉ là để no bụng rồi tiếp tục công việc của mình thôi. Nhưng khi được ngồi bên mọi người, được nghe những câu chuyện, được trò chuyện và tiếp xúc với những sở trường, những nét tính cách riêng của từng người, em mới nhận ra rằng một bữa ăn đôi khi không chỉ đơn giản là một bữa ăn. Đó còn là cơ hội để mọi người gần nhau hơn, để những người vốn chưa thân có thể hiểu nhau thêm một chút.

Em thật sự cảm thấy rất tuyệt vời khi được là một phần trong hành trình này. Có thể em chưa phải là người giỏi giao tiếp nhất, chưa phải người nổi bật nhất hay có thể làm được những điều gì quá lớn lao cho tập thể, nhưng em luôn mong rằng những gì mình có thể đóng góp sẽ mang lại một chút niềm vui và giá trị cho cả nhà.

Cảm ơn mọi người vì đã cho em cơ hội được gặp gỡ, được trải nghiệm, được vui chơi và được lưu giữ những kỷ niệm đẹp như vậy. Cảm ơn vì đã khiến một người đôi khi chỉ quen với việc tự mình làm mọi thứ như em cũng có những khoảnh khắc được hòa vào tập thể, được lắng nghe và được chia sẻ.

Em không biết sau này chúng ta còn có bao nhiêu cơ hội để gặp lại nhau, cùng tham gia những hoạt động như thế này, nhưng em thật lòng mong rằng nếu còn cơ hội, em sẽ tiếp tục được đồng hành cùng mọi người. Và lần tới, em nhất định sẽ cố gắng cởi mở hơn, chơi hết mình hơn, sống trọn vẹn với từng khoảnh khắc và không ngại thể hiện những cảm xúc thật của bản thân nữa.

Ba đợt có thể rồi cũng sẽ khép lại, nhưng những kỷ niệm mà chúng ta cùng tạo nên sẽ luôn là điều em trân trọng. Em mong rằng sau hành trình này, chúng ta không chỉ là những người từng gặp nhau trong một chương trình, mà còn có thể trở thành những người vẫn nhớ đến nhau, vẫn hỏi thăm nhau và vẫn vui vẻ khi có dịp gặp lại.

Cảm ơn cả nhà mình rất nhiều vì đã cùng nhau tạo nên một hành trình thật đẹp. Em vui vì đã gặp được mọi người, vui vì đã có những trải nghiệm mới và vui vì lần này, em không chỉ có những kỷ niệm của riêng mình mà còn có những kỷ niệm được tạo nên cùng cả nhà.

Thương chúc cả nhà luôn vui vẻ, bình an, giữ được nhiệt huyết của mình và dù sau này mỗi người có đi trên một con đường khác nhau, mong rằng chúng ta vẫn sẽ nhớ về nhau bằng những điều tốt đẹp nhất.

Yêu cả nhà mình nhiều lắm!
</script>

Em mượn chiếc hộp thư ẩn danh này để nói ra những điều bấy lâu nay cứ giữ mãi trong lòng. Lời đầu tiên, em muốn gửi lời cảm ơn và cả một lời xin lỗi chân thành nhất đến Cô — người đã mở cánh cửa đưa em đến với một tập thể tuyệt vời như Youth Bond.



Nhóm mình đã qua 3 mùa hoạt động, vậy mà em chỉ mới góp mặt được ở chuyến đi thứ 2 (lần 1 chưa kịp tham gia, lần 3 thì em vướng bận việc học). Nhưng điều khiến em day dứt nhất không chỉ là việc vắng mặt, mà là bởi bản thân em vốn rất nhút nhát và hướng nội. Bước vào một môi trường tràn ngập sự nhiệt huyết, văn minh, lịch sự và gắn kết như YoBond, nhiều lúc em cảm thấy mình quá nhỏ bé, còn nhiều vụng về và chưa đủ tốt để trở thành một mảnh ghép trọn vẹn trong đại gia đình. Em sợ sự rụt rè của mình đã không đạt được sự kỳ vọng mà Cô dành cho em khi trao cho em cơ hội này.



Dù chỉ một lần đồng hành, nhưng từng khoảnh khắc và tình cảm ấm áp của mọi người ở chuyến đi thứ 2 đã được em trân quý cất giữ sâu trong tim. Em sẽ cố gắng từng chút một để mở lòng hơn. Chúc Cô luôn mạnh khỏe, và chúc ngôi nhà Youth Bond ngày càng phát triển, vươn xa và rực rỡ hơn nữa! 
</script>

</script>

Mãi đến ngày cuối cùng, chúng ta mới có cơ hội thật sự kết nối và trò chuyện với nhau. Qua những câu chuyện anh chia sẻ, em cảm nhận được sự gần gũi và đồng điệu, có những điều khiến em nghĩ đến chính mình hồi cấp 3. Em rất trân trọng việc anh có thể thoải mái chia sẻ những suy nghĩ và cảm xúc của mình, bởi dù mới gặp lần đầu, em vẫn có cảm giác như chúng ta đã quen biết từ trước.

Hy vọng rằng lần gặp tiếp theo, em sẽ được nhìn thấy một phiên bản trưởng thành, tự tin và ngày càng hoàn thiện hơn của anh. Hẹn gặp lại anh vào một dịp gần nhất nha! Và nếu có cơ hội, em nhất định sẽ thực hiện lời mời sinh tố lúa mạch còn dang dở hôm ấy. Hahah, lần sau không được từ chối nữa đâu đó! 💗

<script type="text/plain" class="la-thu">
loai: dong-vien
tieude: Gửi đến anh chị trong YOUTH BOND và một số người bạn mới 
ngay: 11/11/2026
anh: ../khongnoithitnoi/hinhanh/image (5).png
chuthich: Một số hình ảnh trong Youth Bond
ky: Một người trong Youth Bond
---
Xin chào mọi người! ❤️

Sau khi trở về, những ký ức trong em vẫn cứ như ngày hôm qua, như thể mọi người vẫn còn ở đây vậy á. Có những lời em vẫn chưa kịp nói một cách trọn vẹn, mà đôi khi em chỉ có thể gói gọn trong hai chữ: *“Em cảm ơn anh/chị.”*

Nếu phải nói hết những niềm vui mà **Youth Bond** đã mang đến cho em, có lẽ một vài dòng này vẫn chưa đủ. Trước tiên, em xin được gửi lời cảm ơn đến đại gia đình **Youth Bond**. Có lẽ em vẫn còn quá trẻ, đôi lúc hơi tham chơi một chút, nhưng anh chị vẫn luôn ở đó, tạo cơ hội để em được tỏa sáng, được thể hiện bản thân và được nói nhiều hơn. Em thật sự rất trân trọng điều đó ạ.

Cảm ơn anh **Thuận**, cảm ơn anh **Văn**, cảm ơn anh **Trọng Nhân**, cảm ơn chị **Linh**, cảm ơn chị **Diễm** dịu dàng – nhớ chỉ em uốn lượn nha trùi =))). Cảm ơn chị **Kiều**, em mong sắp tới sẽ có duyên gặp lại chị. Và cảm ơn **Nghi** đã support cho tui nha, lớp diuuuu. ❤️

Giờ tới lượt nhóm **“SỐNG GIỜ MỸ”**.

Nói tới đây thì chắc mọi người trong nhóm đã biết nhau rồi nha. Mong rằng sắp tới nhóm mình sẽ đầy đủ thành viên và cùng check-in một bức hình thật xinh nhé. NHA ANH **TRƯỜNG**!!!

Cảm ơn **Aurelis** vì đã cùng nhau tỏa sáng. Mong rằng trong những chặng đường sắp tới, mọi người sẽ ngày càng nổi bật hơn, không sáng thì cũng sang nhaaa. ✨✨

Xin gửi lời cảm ơn đến nhóm **Dự án ma**. Cảm ơn một chị *a giấu tên* đã đồng hành cùng bạn H tạo nên dự án 4 giờ sáng đòi ngắm bình minh, xong rồi ngủ một góc mỗi nơi =))). Cảm ơn mọi người đã sát cánh cùng dự án, chân thành cảm ơn 6 con gián đã góp mặt trong hành trình đáng nhớ này. 

Cảm ơn 3 cô giáo Mầm Non tương lai đã vô cùng cởi mở và tạo nên những kỷ niệm khó quên cho nhóm. Em rất hân hạnh khi được làm quen với 3 chị. Chúc các chị luôn thành công, hạnh phúc và sống đúng với những ước mơ của mình. Lớp diuuu. ❤️

Cảm ơn chị Nhân đã đồng hành cùng em qua 3 đợt tập huấn. Mong rằng tình chị em mình vẫn luôn bền và đẹp nha. Em cảm ơn chị guộc rất nhiều, chúc chị luôn thành công và thuận lợi trong mọi công việc. Lớp diuuu. ❤️

Cảm ơn AN đã ngủ sớm, mừng quá trời mừng =))). Mong bạn sẽ tiếp tục phát huy và tự tin nói nhiều hơn nha. Bạn đã làm rất tốt rồi, mình thật sự rất ấn tượng .

Cuối cùng, em xin gửi lời cảm ơn đến tất cả mọi người đã cùng nhau tạo nên một buổi tập huấn thật vui vẻ, thoải mái và đầy ắp những kỷ niệm đáng nhớ. Cảm ơn vì đã cho em cơ hội được gặp gỡ, kết nối, trải nghiệm và có thêm những người tuyệt vời trong hành trình của mình.

Mong rằng trên những chặng đường sắp tới, mọi người sẽ luôn thành công, tự tin hơn, tiếp tục tỏa sáng theo cách riêng của mình và dù có đi đâu, làm gì thì chúng ta vẫn sẽ nhớ về nhau bằng những ký ức thật đẹp.

**Chân thành cảm ơn mọi người vì đã trở thành một phần thanh xuân của em.** ❤️
</script>

Mỗi người trong nhà đều có một màu sắc, một thế mạnh và tài năng riêng. Đôi lúc nhìn mọi người, em lại thấy bản thân mình chẳng có gì quá nổi bật. Nhưng điều khiến em biết ơn nhất là dù em còn nhiều thiếu sót, mọi người vẫn luôn ở bên, kiên nhẫn chỉ bảo, giúp đỡ và cho em cơ hội để học hỏi, trưởng thành hơn từng ngày. Mọi người không chỉ giúp em biết mình cần làm gì, mà còn khiến em tin rằng mình cũng có thể trở thành một phiên bản tốt hơn của chính mình.

Ở trong nhà, em gần như là đứa nhỏ nhất, nhưng độ láo thì chắc chẳng thua ai, suốt ngày kiếm chuyện với mọi người 😭 Vậy mà chẳng những không bị đuổi khỏi nhà, em còn được mọi người thương, bao dung và chiều chuộng rất nhiều. Chính những điều tưởng chừng nhỏ bé ấy lại khiến em cảm thấy mình thật may mắn khi được gặp và trở thành một phần của mọi người.

Em không biết chúng ta sẽ còn đồng hành cùng nhau bao lâu, cũng chẳng biết sau này mỗi người sẽ đi đến đâu. Vì vậy, em luôn tự nhắc mình phải trân trọng thật nhiều những khoảnh khắc hiện tại, những lần cùng nhau cười nói, làm việc, những lúc được mọi người chỉ bảo và cả những chuyện nhỏ nhặt mà có lẽ sau này nhớ lại sẽ thấy thương vô cùng.

Cảm ơn mọi người vì đã cho em một nơi để học hỏi, để trưởng thành, để được là chính mình và để cảm nhận rằng mình thật sự thuộc về một tập thể. Mong rằng dù sau này mỗi người có một hành trình riêng, chúng ta vẫn sẽ nhớ về nhau bằng những điều đẹp đẽ nhất, vẫn giữ trong lòng tình cảm của những người từng cùng nhau đi qua một đoạn thanh xuân và xem nhau như anh em trong một gia đình.

Cảm ơn chị vì đã luôn mang đến cho em những nguồn năng lượng tích cực và những nụ cười thật ấm áp. Em rất thích những khoảnh khắc hai chị em cứ nhìn nhau rồi bật cười, chẳng cần một lý do cụ thể nào. Có lẽ chính những điều giản dị như thế đã khiến khoảng thời gian ở bên chị trở nên thật đáng nhớ đối với em.

Không biết chị còn nhớ không, nhưng trong bữa ăn đầu tiên, chị đã ngồi cùng bàn với em. Khi ấy chị khá ít nói, em trò chuyện mà chị cứ im ru, khiến em nghĩ chị là một người trầm tính. Vậy mà càng có cơ hội tiếp xúc, em càng nhận ra một khía cạnh rất khác ở chị: năng động, vui vẻ và đáng yêu. Thật vui vì em đã có cơ hội hiểu chị nhiều hơn, thay vì chỉ dừng lại ở những ấn tượng ban đầu.

Bên cạnh những điều đáng yêu ấy, em thật sự rất ngưỡng mộ chị. Em biết con đường ngôn ngữ mà chị đang theo đuổi không hề dễ dàng, bởi bản thân em cũng từng có cơ hội trải nghiệm những khó khăn của nó. Vì vậy, khi nhìn thấy chị không ngừng học hỏi, phát triển và từng bước tiến gần hơn đến những điều mình mong muốn, em cảm thấy rất khâm phục. Mong rằng chị sẽ luôn giữ vững niềm tin, sự kiên trì và tình yêu dành cho con đường mình đã chọn. Chúc chị sẽ ngày càng trưởng thành, đạt được thật nhiều thành tựu và luôn tự hào về những nỗ lực của chính mình.

Em hy vọng rằng dù sau này mỗi người có những hành trình riêng, chúng ta vẫn sẽ có cơ hội gặp lại, cùng nhau chia sẻ những câu chuyện và giữ mãi những kỷ niệm đẹp đã có. Cảm ơn chị vì đã xuất hiện trong khoảng thời gian này của em, vì những nụ cười, sự tích cực và những điều tốt đẹp mà chị đã vô tình mang đến.

Chúc chị luôn hạnh phúc, bình an và tỏa sáng theo cách riêng của mình. Mong rằng trên hành trình phía trước, chị sẽ luôn gặp được những điều xứng đáng với sự cố gắng và trái tim tuyệt vời của chị. 💗
</script>
<script type="text/plain" class="la-thu">

Hello 4 chị, mỗi ng đồg hành cùg em qua các đợt tập huân, tuy 4 ngày ko dài nhưng em vẫn lun giữ lấy từng chút kỷ niệm và lưu giữ ko lm cho nó tan biến.



Em là 1 ng khá nhút nhát và hướng nội, nhưng kia tiếp xúc vs các chj thì em đã bước ra vùng tối mà chính e nghĩ em đã bước dc, mỗi chj cho em 1 cảm giác ko giống nhau nhưng cùng 1 mục tiêu đó là " vẫn tích cực và tâm sự nhìu vào" đó là em nhớ nhất khi dc tiếp xúc và lm vc vs các chj.



Cảm ơn chj Trâm, người đã đến đầu tiên và kéo em ra khỏi sự ít nói, chj cho em dc cảm giác có 1 ng chj, 1 ng bn, 1 ng em có thể tin tưởng nói chuyện và ko cần phải giấu cảm xúc, qtam em rằg em có ăn chưa hoặc làm cho em những điều nhỏ nhặt, là 1 ng chj mà e hằng mong ước, minh đợt sau chj em mình sẽ gặp lại.Cảm ơn chj 2.



Cảm ơn chj H.Như, người em dc chug team và cho em bt dc rằg em có 1 ng trưởng nhóm tuyệt vời, tự tin và slay, cảm ơn chj vì những ý tưởng hay, vì những bài học, vì những lần cùg nhau đưa nhóm vươn lên từ vị trí 5 lên vị trí 2, tuy chj ít nói nhưng em bt dc chj là 1 ng rấtt tâm huyết vs vc mình lm và sự cố gắng của chj đã nói lên điều đó, cảm ơn chj đã cố gắng cho team AURELIS và cho em dc những kỉ niệm khó quên. Cảm ơn chj vì tất cả.



Cảm ơn chj Ngọc, lần đầu tiên em bt 1 ng có thể giỏi tiếng Nhật như chị, nó làm em có thêm độg lực để hc tiếp thứ ngôn ngữ này dù có những lúc mún bỏ cuộc vì quá khó, chj có 1 năng lượng tích cực siu siu nhìu, luôn vui vẻ và hài hước, luôn và người kể những chuyện hài hay khấy độg bầu không khí khi quá yên ắng, em mong muốn khi gặp mình chúg ta sẽ có những kỷ niệm đẹp khi lm vc vs nhau nx. Em cảm ơn chj.



Cuối cùng là chj V.anh, em gặp chj vào lúc em ko bt tâm sự vs ai, chj đã đến và nói chuyện cùg em, lm quen và tâm sự vs em nhìu thứ, 2 chj em đi vòng quanh siu thị nhưng mãi nói chuyện nên ko quan tâm giờ, và đêm cuối đã đc vui chơi, tâm sự vs nhau tht lâu trc khi chia tay, em mong đêm đó trôi qua lâu 1 chút để ta có thể típ những câu chuyện còn dang dở, lời hẹn đi biển ngắm bình mình hay những tâm sự thầm kín mà chj và em tin tưởng để kể nhau nghe. Em cảm chj vì những kỷ niệm chj để lại cho em và em sẽ lưu giữ nó.

Lời nói cuối, em xin cảm ơn các ah/chj, và thầy cô đã nâng đỡ và giúp e phát triển bản thân, đã giúp em quen dc nhìu bn ms và cho em dc là chính em mà ko cần phải cố gắng gượng ép, cảm ơn tất cả mọi ng vì mọi thứ.



Em mog cho các chj và mn sẽ thành côg trên con đường mình đag đi và cả phía trc, chúc mn sẽ ln tích cực và vui vẻ, mog sự tiêu cực "đi ra kia chơi !!" Và hy vọng đợt sau ta lai gặp nhau và cười tht tươi nhé !

Từ một người còn nhiều bỡ ngỡ, đôi khi thiếu tự tin, em đã dần biết cách lắng nghe, chia sẻ, làm việc nhóm, giao tiếp và mạnh dạn thể hiện suy nghĩ của mình hơn. Em cũng học được cách nhìn nhận vấn đề từ nhiều góc độ, biết chọn lọc thông tin và có trách nhiệm hơn với những điều mình làm



Điều em trân trọng nhất không chỉ là những kiến thức đã học được mà còn là những trải nghiệm, những người đã gặp và những kỷ niệm mà em sẽ luôn nhớ. Có lẽ em vẫn còn nhiều điều phải học, nhưng em tin rằng mình đã tiến bộ hơn so với ngày đầu tiên.

Cảm ơn vì đã là một phần trong hành trình trưởng thành của em. Dù sau này mỗi người có đi trên một con đường khác nhau, em vẫn sẽ luôn trân trọng những ngày tháng này.
